<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact Us</title>

    <link href="../css/main.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <nav class="main-nav">
        <div class="nav-left">
          <a class="nav-image-link" href="../html/index.html">
            <img
              class="nav-logo nav-image-default"
              src="../image/qqtea-icon.svg"
              alt="QQTea icon"
            />
            <img
              class="nav-logo nav-image-hover"
              src="../image/qqtea-icon-hover.svg"
              alt="QQTea icon"
            />
          </a>
        </div>

        <div class="nav-right">
          <a class="nav-link" href="../html/about.html">ABOUT</a>
          <a class="nav-link" href="../html/product-listing.html">MENU</a>
          <a class="nav-link" href="../html/contact.html">CONTACT US</a>
          <a class="nav-image-link" href="../html/cart.html">
            <img
              class="nav-cart-icon nav-image-default"
              src="../image/cart-icon.svg"
              alt="Shopping cart icon"
            />
            <img
              class="nav-cart-icon nav-image-hover"
              src="../image/cart-icon-hover.svg"
              alt="Shopping cart icon"
            />
          </a>
        </div>
      </nav>
    </header>

    <main class="contact-section">
      <h2>GET IN TOUCH</h2>
      <p>
        Questions, feedback or ideas - write to us and we will reply by email.
      </p>

      <form class="contact-form">
        <div class="form-content">
          <div>
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" required />
          </div>

          <div>
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" required />
          </div>
        </div>

        <div>
          <label for="contact-message">Message</label>
          <textarea id="contact-message" required></textarea>
          <button type="submit">Send</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div>
          <a class="nav-image-link" href="../html/index.html">
            <img
              class="footer-logo"
              src="../image/qqtea-icon-footer.svg"
              alt="QQTea icon"
            />
          </a>
        </div>

        <div class="footer-link">
          <p class="footer-heading">ABOUT</p>
          <a href="#">Terms of Service</a>
          <a href="#">Privacy Policy</a>
          <a href="#">FAQs</a>
        </div>

        <div class="footer-link">
          <p class="footer-heading">OTHERS</p>
          <a href="../html/styleguide.html">Style Guide</a>
          <a href="#">Citation</a>
          <a href="https://github.com/qiaolexii7/IAT339_P01">Github</a>
        </div>

        <div class="footer-newsletter">
          <p class="footer-heading">SUBSCRIBE</p>
          <p class="newsletter-text">
            Stay updated on the latest drinks and get access to special offers!
          </p>

          <form class="newsletter-form">
            <input
              type="email"
              placeholder="Enter your email"
              aria-label="Email adress"
              required
            />
            <button type="submit">Submit</button>
          </form>
        </div>
      </div>
    </footer>
  </body>
</html>
